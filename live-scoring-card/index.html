<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rough-draft demo of the Gruesome Foursome live scorecard, leaderboard and Acorns course map. Sample scores only.">
<meta property="og:title" content="Gruesome Live (demo)">
<meta property="og:description" content="Live scorecard, leaderboard and course map for the Gruesome Foursome Golf Invitational. Sample scores only.">
<meta name="theme-color" content="#0B2C1D">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gruesome Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Oswald:wght@400..700&family=Public+Sans:wght@400..700&display=swap">
<style>
/* Layout: one phone-width column, a dashed "prototype controls" strip on top, app screens below, tab bar fixed to the bottom. Single deliberate look: Gruesome crest green, cream and gold. */
:root{
  --pine:#0B2C1D; --pine-2:#123D29; --pine-3:#1B5236; --line:#2E6B48;
  --cream:#F4EFE0; --cream-2:#FBF8EE; --sand:#D9CFB2; --ink:#173A2A; --muted:#4E6357; --mist:#A9C2B1;
  --gold:#E2B53E; --gold-ink:#7A5B0F; --red:#B8262F; --good:#1F6B3F; --warn:#9A6A0B;
  --display:'Libre Caslon Text', Georgia, serif; --label:Oswald, 'Arial Narrow', Arial, sans-serif; --body:'Public Sans', Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--pine);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pine)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lbl{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* prototype strip */
.proto{border:1.5px dashed var(--gold);border-radius:14px;padding:10px 12px;display:grid;gap:8px;background:rgba(226,181,62,.06)}
.proto-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.proto .lbl{color:var(--gold)}
.proto select{flex:1;min-width:0;background:var(--pine-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.proto input[type=range]{flex:1;min-width:120px;accent-color:var(--gold)}
.clock{font-family:var(--label);font-size:18px;min-width:76px;text-align:right}
.chip-btn{background:var(--pine-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-family:var(--label);letter-spacing:.06em;font-size:13px}

/* header */
.head{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.head img{width:52px;height:52px}
.head h1{font-family:var(--display);font-size:24px;line-height:1.1;margin:0}
.head .who{color:var(--mist);font-size:13px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--pine-2);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{background:none;border:0;border-radius:12px;padding:8px 4px;font-family:var(--label);letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--mist)}
.tab[aria-selected=true]{background:var(--gold);color:var(--pine)}

.card{background:var(--cream);color:var(--ink);border-radius:18px;padding:16px}
.stack{display:grid;gap:12px}
.note{border-radius:14px;padding:12px 14px;font-size:14px}
.note.gold{background:rgba(226,181,62,.14);border:1px solid rgba(226,181,62,.5);color:var(--cream)}
.note.dim{background:var(--pine-2);border:1px solid var(--line);color:var(--mist)}
.note b{color:var(--cream)}

/* scorecard */
.hole-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hole-no{font-family:var(--display);font-size:64px;line-height:.9;font-weight:700}
.hole-meta{font-family:var(--label);font-size:15px;color:var(--muted);text-align:right}
.pace{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--pine);color:var(--cream);border-radius:16px;padding:12px 14px}
.step{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--pine-3);font-size:30px;line-height:1}
.score-big{text-align:center}
.score-big .v{font-family:var(--label);font-size:60px;font-weight:600;line-height:1}
.score-big .t{font-family:var(--label);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.drives{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drive{border:1.5px solid var(--sand);background:var(--cream-2);border-radius:12px;padding:12px 8px;font-weight:600;color:var(--ink)}
.drive[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--pine)}
.quota{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.q{border-radius:10px;padding:6px 4px;text-align:center;font-family:var(--label);font-size:13px;letter-spacing:.04em}
.q.ok{background:var(--good);color:var(--cream)}
.q.pend{background:rgba(226,181,62,.35);color:var(--ink);border:1.5px solid var(--gold)}
.q.need{border:1.5px dashed var(--red);color:var(--red)}
.warn{font-size:14px;font-weight:600}
.warn.red{color:var(--red)} .warn.amber{color:var(--warn)} .warn.ok{color:var(--good)}
.save{width:100%;border:0;border-radius:999px;padding:16px;background:var(--gold);color:var(--pine);font-family:var(--label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:16px}
.save:disabled{background:var(--sand);color:var(--muted);cursor:not-allowed}
.ghost{width:100%;border:1px solid var(--sand);background:none;border-radius:999px;padding:12px;color:var(--muted);font-family:var(--label);letter-spacing:.1em;text-transform:uppercase}
.sg{display:flex;gap:12px;align-items:flex-start;background:var(--pine);color:var(--cream);border-radius:14px;padding:14px}
.sg input{width:26px;height:26px;accent-color:var(--gold);flex:none;margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.cell{border-radius:8px;padding:4px 0 5px;text-align:center;background:var(--pine);color:var(--mist);border:1px solid var(--line);font-family:var(--label);line-height:1.15}
.cell small{display:block;font-size:10px;opacity:.75}
.cell .s{font-size:16px}
.cell.done{color:var(--cream)}
.cell.under .s{color:#F2A3A8}
.cell.cur{border-color:var(--gold);color:var(--gold)}
.cell.edit{outline:2px solid var(--gold)}

/* board */
.rows{display:grid}
.row{display:grid;grid-template-columns:30px 36px minmax(0,1fr) 34px 50px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--sand)}
.row:last-child{border-bottom:0}
.row.me{background:rgba(226,181,62,.18);border-radius:12px;margin:0 -8px;padding:10px 8px}
.pos{font-family:var(--label);font-size:20px;font-weight:600}
.bub{width:34px;height:34px;border-radius:50%;background:var(--pine);color:var(--cream);display:grid;place-items:center;font-family:var(--label);font-size:13px;border:2.5px solid var(--line)}
.bub.lead{border-color:var(--gold)}
.tname{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;min-width:0}
.tsub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.thru{font-family:var(--label);font-size:16px;text-align:center}
.par{font-family:var(--label);font-size:24px;font-weight:600;text-align:right}
.par.under{color:var(--red)}
.lock{font-family:var(--label);font-size:13px;color:var(--muted);text-align:right;letter-spacing:.06em}
.can{display:inline-block;font-family:var(--label);font-size:10px;letter-spacing:.06em;padding:1px 5px;border-radius:5px;border:1px solid var(--sand);color:var(--muted)}
.can.on{background:var(--gold);border-color:var(--gold);color:var(--pine)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0 4px}
.sec-h h2{font-family:var(--display);font-size:18px;margin:0}
.sec-h .lbl{color:var(--gold-ink)}
.skins{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.skin{border-radius:8px;padding:4px 2px;text-align:center;font-family:var(--label);font-size:11px;background:var(--cream-2);border:1px solid var(--sand);color:var(--muted);line-height:1.2}
.skin.won{background:var(--gold);border-color:var(--gold);color:var(--pine)}

/* map */
.map-box{background:#163F2A;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.map-box svg{display:block;width:100%;height:auto;max-height:70vh}
.map-ctl{display:flex;gap:6px;flex-wrap:wrap}
.map-ctl .chip-btn[aria-pressed=true]{background:var(--gold);color:var(--pine);border-color:var(--gold)}
.tb{transition:transform .9s cubic-bezier(.3,.8,.3,1)}
.tb{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mist)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:5px}
.info{display:grid;gap:4px}
.info h3{font-family:var(--display);margin:0;font-size:20px}

/* rules */
.rules{display:grid;gap:10px;counter-reset:r}
.rule{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.rule .n{font-family:var(--label);font-size:22px;color:var(--gold-ink);font-weight:600}
.tag{display:inline-block;margin-top:4px;font-family:var(--label);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--good);color:var(--cream);border-radius:6px;padding:2px 7px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.tb{transition:none}}
</style>

</head>

/* ---------- course ---------- */
const PAR=[4,4,4,4,5,3,5,4,3,4,4,3,5,4,3,4,5,4];
const YDS=[385,343,320,335,560,130,466,344,149,360,336,170,520,399,180,380,525,350];
const HCP=[5,7,17,13,9,11,1,3,15,6,12,18,16,4,8,14,10,2];
const PACE=[15,30,45,60,82,90,113,128,135,150,165,173,195,210,218,233,255,270]; // from the Acorns card, minutes after tee
const FIRST=8*60+40, GAP=8;

/* ---------- field: tee sheet order, rosters from The Draft 2026 ---------- */
const TEAMS=[
 ['Fleischauer','TF',['Tim','Polovich','Quinlan','Conway']],
 ['Allen','DA',['DA','Cygan','Goldy','Riddle']],
 ['Wetz','LW',['Wetz','J Campbell','Delsha','JQ']],
 ['Witt','JW',['Witt','Bo','C Schaefer','Marsala']],
 ['Fannon','FN',['Fannon','Milk','T Sigs','Banker']],
 ['Skaer','AS',['Skaer','Koonce','S Andres','Luke Bick']],
 ['Jon Pickett','JP',['Jon','Dallas','T Rick','DJ']],
 ['McRoberts','BM',['McRob','Vijay','B Johnson','J Anderson']],
 ['Arab','AR',['Arab','Bednar','Danny Bick','Kossina']],
 ['Schultheis','DS',['Drew','Nick Scott','Alex','Steve Lee']],
 ['Matt Scott','MS',['Matt','Jordy','Eli','Caywood']],
 ['Cappel','CA',['Cappel','Keegan','S Dodd','Coz']],
 ['Bretwisch','BR',['Bretwisch','Rodenberg','Signore','Gehring']],
 ['Dillenberger','BD',['Dilly','Nevois','T Wetz','Laz']],
 ['Wirth','WI',['Wirth','Nate Vogt','Minnaert','T Henry']],
 ['Chris Pickett','CP',['C Pickett','Schrock','Kohler','Diesel']],
].map(([name,ini,roster],i)=>({i,name:'Team '+name,short:name,ini,roster,tee:FIRST+GAP*i}));

/* ---------- simulated round (stands in for the Google Sheet) ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SIM=TEAMS.map(t=>{
  const r=rng(1000+t.i*77), str=(r()-.5)*.18, f=.93+r()*.12;
  const scores=PAR.map(p=>{const x=r();const pE=p===5?.07:p===4?.012:0;const pB=(p===5?.55:p===4?.36:.24)+str;const pBo=.07;
    return x<pE?p-2:x<pE+pB?p-1:x>1-pBo?p+1:p});
  const finish=PACE.map((m,h)=>Math.round(m*f+(h>=5?3:0)+(h>=11?3:0)));
  const drives=new Array(18);
  [[0,9],[9,18]].forEach(([a,b])=>{const holes=[];for(let h=a;h<b;h++)holes.push(h);
    for(let k=holes.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[holes[k],holes[j]]=[holes[j],holes[k]]}
    holes.forEach((h,k)=>drives[h]=k<4?k:(r()<.6?0:Math.floor(r()*4)))});
  return{scores,finish,drives,sg:{6:r()<.88,12:r()<.85}};
});

/* ---------- state ---------- */
const S={view:'c5',tab:'card',clock:11*60+20,entries:TEAMS.map(()=>({scores:{},drives:{},sg:{}})),draft:null,edit:null,signed:{},mapZoom:'all',sel:null,playing:null};
const viewer=()=>S.view==='pub'?{kind:'pub'}:S.view==='op'?{kind:'op'}:{kind:'cap',t:+S.view.slice(1)};

function simDone(t){const e=S.clock-TEAMS[t].tee;if(e<0)return 0;let n=0;while(n<18&&SIM[t].finish[n]<=e)n++;return n}
function entered(t){let n=0;while(n<18&&S.entries[t].scores[n]!=null)n++;return n}
function done(t){return Math.max(simDone(t),entered(t))}
function score(t,h){const v=S.entries[t].scores[h];return v!=null?v:SIM[t].scores[h]}
function drive(t,h){const v=S.entries[t].drives[h];return v!=null?v:SIM[t].drives[h]}
function shotgun(t,stop){const v=S.entries[t].sg[stop];if(v!=null)return v;return done(t)>=stop-1&&S.clock-TEAMS[t].tee>SIM[t].finish[stop-2]+2?SIM[t].sg[stop]:null}
function toPar(t){let s=0;for(let h=0;h<done(t);h++)s+=score(t,h)-PAR[h];return s}
const allDone=()=>TEAMS.every(t=>done(t.i)===18);
function canSee(v,t){if(v.kind==='op')return true;if(v.kind==='pub')return allDone();if(t===v.t)return true;if(done(v.t)===18)return true;return t>v.t}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(m){m=Math.round(m);let h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+' '+ap}
const fp=n=>n===0?'E':n>0?'+'+n:'−'+Math.abs(n);
const nameFor=d=>({'-2':'Eagle','-1':'Birdie','0':'Par','1':'Bogey','2':'Double'})[d]||(d<-2?'Albatross':'+'+d);
function paceState(t){const T=TEAMS[t],d=done(t);if(S.clock<T.tee)return{txt:'Tees off '+fmt(T.tee),k:'wait'};if(d===18)return{txt:'Finished',k:'fin'};
  let exp=0;while(exp<18&&T.tee+PACE[exp]+6<=S.clock)exp++;return exp-d>=1?{txt:'Behind pace',k:'behind'}:{txt:'On pace',k:'ok'}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}

/* ---------- final order with house tie-break rules ---------- */
function ranked(ids){
  const arr=ids.slice().sort((a,b)=>toPar(a)-toPar(b)||done(b)-done(a));
  const finalMode=ids.length===16&&allDone();
  const order=HCP.map((x,h)=>[x,h]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  if(finalMode){arr.sort((a,b)=>{const d=toPar(a)-toPar(b);if(d)return d;if(toPar(a)===toPar(arr[0]))return 0;for(const h of order){const x=score(a,h)-score(b,h);if(x)return x}return 0})}
  let out=[],prev=null,pos=0;
  arr.forEach((t,k)=>{const tp=toPar(t);let label;
    if(finalMode){const tiedLead=arr.filter(x=>toPar(x)===toPar(arr[0])).length>1;
      if(tiedLead&&tp===toPar(arr[0]))label='P';else label=String(k+1)}
    else{if(prev===null||tp!==prev){pos=k+1}label=(arr.filter(x=>toPar(x)===tp).length>1?'T':'')+pos}
    prev=tp;out.push({t,label})});
  return{rows:out,finalMode};
}

/* ---------- views ---------- */
function renderWho(){const v=viewer();
  $('#who').textContent=v.kind==='pub'?'Public board · bettors, spectators, clubhouse TV':v.kind==='op'?'Operator view · sees every score live':`Captain · ${TEAMS[v.t].name} · ${fmt(TEAMS[v.t].tee)} tee`}

function viewCard(){const v=viewer();
  if(v.kind!=='cap')return`<div class="note dim">Captains log scores here. Pick a captain under <b>View as</b> to try the scorecard.</div>`;
  const t=v.t,T=TEAMS[t],d=done(t);
  if(d===18&&S.edit==null)return finishedCard(t);
  const h=S.edit!=null?S.edit:d;
  if(S.draft==null||S.draft.h!==h)S.draft={h,score:S.edit!=null?score(t,h):PAR[h],drive:S.edit!=null?drive(t,h):null};
  const D=S.draft,diff=D.score-PAR[h];
  const nineA=h<9?0:9,nineB=nineA+9;
  // quota: drives already used on this nine (excluding this hole), plus the current pick
  const used=[[],[],[],[]];for(let k=nineA;k<nineB;k++){if(k===h)continue;if(k<d){used[drive(t,k)].push(k+1)}}
  if(D.drive!=null)used[D.drive].push(h+1);
  const need=used.map((u,i)=>u.length?null:i).filter(x=>x!=null);
  const left=Math.max(0,nineB-1-Math.max(h,d-1));
  const slots=left+(D.drive==null?1:0);
  let warn;
  if(!need.length)warn=`<div class="warn ok">Quota met for the ${nineA?'back':'front'} nine.</div>`;
  else if(need.length>slots)warn=`<div class="warn red">Quota can’t be met: ${need.map(i=>esc(T.roster[i])).join(', ')} still ${need.length>1?'need drives':'needs a drive'} and only ${slots} hole${slots===1?'':'s'} left on this nine.</div>`;
  else if(need.length===slots)warn=`<div class="warn amber">Every hole left on this nine${D.drive==null?', including this one,':''} must be a drive from ${need.map(i=>esc(T.roster[i])).join(' or ')}.</div>`;
  else warn=`<div class="warn amber">Still need a drive from ${need.map(i=>esc(T.roster[i])).join(', ')} · ${slots} hole${slots===1?'':'s'} left on this nine.</div>`;
  const stop=h===5?6:h===11?12:null;
  const sgDone=stop?shotgun(t,stop):null;
  const ctp=h===8||h===14;
  const pace=paceState(t);
  return`<div class="stack">
  ${S.clock<T.tee?`<div class="note dim">Your tee time is <b>${fmt(T.tee)}</b>. Move the clock to play out the field, or start logging now.</div>`:''}
  <div class="card stack">
    <div class="hole-head"><div><div class="lbl" style="color:var(--gold-ink)">${S.edit!=null?'Editing hole':'Hole'}</div><div class="hole-no">${h+1}</div></div>
      <div class="hole-meta num">Par ${PAR[h]} · ${YDS[h]} yds${h===17?' (white)':''}<br>HCP ${HCP[h]}<div class="pace">Card pace: done by ${fmt(T.tee+PACE[h])} · ${pace.txt}</div></div></div>
    ${stop&&S.edit==null?`<label class="sg"><input type="checkbox" id="sgBox" ${sgDone?'checked':''}><span><span class="lbl" style="color:var(--gold)">Shotgun stop · before hole ${stop}</span><br>We took our shotguns and sent the video.</span></label>`:''}
    ${ctp?`<div class="note gold" style="color:var(--ink)"><b style="color:var(--ink)">Closest to the pin.</b> You don’t have to play this ball if you need someone’s quota drive.</div>`:''}
    <div class="stepper"><button class="step" id="minus" type="button" aria-label="One less stroke">−</button>
      <div class="score-big"><div class="v num">${D.score}</div><div class="t">${nameFor(diff)}</div></div>
      <button class="step" id="plus" type="button" aria-label="One more stroke">+</button></div>
    <div class="lbl" style="color:var(--gold-ink)">Whose drive did you play?</div>
    <div class="drives">${T.roster.map((p,i)=>`<button class="drive" type="button" data-drive="${i}" aria-pressed="${D.drive===i}">${esc(p)}</button>`).join('')}</div>
    <div class="lbl" style="color:var(--gold-ink)">${nineA?'Back':'Front'} nine quota · one drive each</div>
    <div class="quota">${T.roster.map((p,i)=>{const u=used[i];const cur=D.drive===i&&u.length===1&&u[0]===h+1;
      return`<div class="q ${u.length?(cur?'pend':'ok'):'need'}">${esc(p.split(' ').pop())}<br>${u.length?'#'+u.join(', #'):'—'}</div>`}).join('')}</div>
    ${warn}
    <button class="save" id="save" type="button" ${D.drive==null?'disabled':''}>${D.drive==null?'Pick whose drive':S.edit!=null?'Update hole '+(h+1):'Save hole '+(h+1)}</button>
    ${S.edit!=null?`<button class="ghost" id="cancelEdit" type="button">Cancel</button>`:''}
  </div>
  ${strip(t,h)}
  </div>`}

function strip(t,cur){const d=done(t);const cell=h=>{const s=h<d?score(t,h):null;const cls=['cell',h<d?'done':'',s!=null&&s<PAR[h]?'under':'',h===cur&&S.edit==null?'cur':'',S.edit===h?'edit':''].join(' ');
    return`<button class="${cls}" type="button" data-hole="${h}" ${h<d?'':'disabled'} aria-label="Hole ${h+1}${s!=null?', '+s:''}"><small>${h+1}</small><span class="s num">${s!=null?s:'·'}</span></button>`};
  const tp=toPar(t);
  return`<div class="stack" style="gap:6px"><div class="sec-h"><span class="lbl" style="color:var(--gold)">Your card · tap a hole to fix it</span><span class="lbl num" style="color:var(--cream)">Thru ${d} · ${fp(tp)}</span></div>
  <div class="strip">${[0,1,2,3,4,5,6,7,8].map(cell).join('')}</div><div class="strip">${[9,10,11,12,13,14,15,16,17].map(cell).join('')}</div></div>`}

function finishedCard(t){const T=TEAMS[t];const tot=PAR.reduce((s,p,h)=>s+score(t,h),0);
  const misses=[];[[0,9,'front'],[9,18,'back']].forEach(([a,b,n])=>{const c=[0,0,0,0];for(let h=a;h<b;h++)c[drive(t,h)]++;c.forEach((x,i)=>{if(!x)misses.push(`${T.roster[i]} had no drive on the ${n} nine`)})});
  [6,12].forEach(s=>{if(!shotgun(t,s))misses.push(`No shotgun check before hole ${s}`)});
  return`<div class="stack"><div class="card stack">
    <div class="lbl" style="color:var(--gold-ink)">Card complete</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end"><div class="hole-no num">${tot}</div><div class="hole-meta"><span class="par ${toPar(t)<0?'under':''}">${fp(toPar(t))}</span></div></div>
    <div class="note ${misses.length?'gold':'dim'}" style="color:var(--ink);background:${misses.length?'rgba(226,181,62,.18)':'var(--cream-2)'};border-color:var(--sand)">${misses.length?'<b style="color:var(--ink)">Check before signing:</b><br>'+misses.map(esc).join('<br>'):'All rules checks passed: quota drives on both nines and both shotgun stops.'}</div>
    ${S.signed[t]?`<div class="warn ok">Signed by ${esc(T.roster[0])}. Card locked.</div>`:`<button class="save" id="sign" type="button">Sign and lock card</button>`}
    <div class="note dim" style="background:var(--cream-2);color:var(--muted);border-color:var(--sand)">You’ve finished, so the full leaderboard is now open to you.</div>
  </div>${strip(t,-1)}</div>`}

function boardRow(t,label,v){const vis=canSee(v,t),me=v.kind==='cap'&&v.t===t,tp=toPar(t),d=done(t),P=paceState(t);
  const sg=[6,12].map(s=>{const x=shotgun(t,s);return`<span class="can ${x?'on':''}" title="Shotgun before ${s}: ${x?'done':'not yet'}">SG${s}</span>`}).join('');
  return`<div class="row ${me?'me':''}"><div class="pos num">${vis?label:''}</div><div class="bub ${vis&&label==='1'?'lead':''}">${TEAMS[t].ini}</div>
  <div style="min-width:0"><div class="tname">${esc(TEAMS[t].short)}</div><div class="tsub">${fmt(TEAMS[t].tee)} · ${P.txt} ${vis?sg:''}</div></div>
  <div class="thru num">${d===18?'F':d}</div>${vis?`<div class="par num ${tp<0?'under':''}">${d?fp(tp):'–'}</div>`:`<div class="lock">Hidden</div>`}</div>`}

function viewBoard(){const v=viewer();const ids=TEAMS.map(t=>t.i);
  if(v.kind==='pub'&&!allDone()){const last=Math.max(...TEAMS.map(t=>t.tee+SIM[t.i].finish[17]));
    return`<div class="stack"><div class="note gold"><b>Scores are hidden until the last group finishes</b> (about ${fmt(last)}). Then the full board is revealed. The map shows where everyone is.</div>
    <div class="card"><div class="sec-h"><h2>On the course</h2><span class="lbl">Thru</span></div><div class="rows">${ids.slice().sort((a,b)=>done(b)-done(a)||a-b).map(t=>boardRow(t,'',v)).join('')}</div></div></div>`}
  if(v.kind==='cap'&&done(v.t)<18){const vis=ids.filter(t=>t>=v.t),hid=ids.filter(t=>t<v.t);const R=ranked(vis);
    return`<div class="stack"><div class="note dim">You see your team and every group that tees off after you. Groups ahead of you stay hidden until you finish.</div>
    <div class="card"><div class="sec-h"><h2>You and the groups behind you</h2><span class="lbl">Thru · Score</span></div><div class="rows">${R.rows.map(r=>boardRow(r.t,r.label,v)).join('')}</div></div>
    ${hid.length?`<div class="card"><div class="sec-h"><h2>Teed off ahead of you</h2><span class="lbl">Hidden until you finish</span></div><div class="rows">${hid.map(t=>boardRow(t,'',v)).join('')}</div></div>`:''}</div>`}
  const R=ranked(ids);
  const head=R.finalMode?`<div class="note gold"><b>Final results.</b> ${R.rows[0].label==='P'?'Tie for 1st goes to a playoff hole, most likely 18.':''} Ties for 2nd and 3rd are broken on the card from the hardest hole: 7, 18, 8, 14…</div>`:v.kind==='op'?`<div class="note dim">Operator view: every score, live. Captains and the public board don’t see this.</div>`:`<div class="note dim">You’ve finished, so you see the whole field.</div>`;
  return`<div class="stack">${head}<div class="card"><div class="sec-h"><h2>${R.finalMode?'Final board':'Live board'}</h2><span class="lbl">Thru · Score</span></div><div class="rows">${R.rows.map(r=>boardRow(r.t,r.label,v)).join('')}</div></div>
  ${(v.kind==='op'||R.finalMode)?skins():''}</div>`}

function skins(){const cells=PAR.map((p,h)=>{const fin=TEAMS.filter(t=>done(t.i)>h).map(t=>t.i);if(!fin.length)return`<div class="skin">${h+1}<br>–</div>`;
    const best=Math.min(...fin.map(t=>score(t,h)));const w=fin.filter(t=>score(t,h)===best);
    return`<div class="skin ${w.length===1?'won':''}">${h+1}<br>${w.length===1?TEAMS[w[0]].ini:best}</div>`}).join('');
  return`<div class="card stack" style="gap:8px"><div class="sec-h"><h2>Skins</h2><span class="lbl">Gold = won outright</span></div><div class="skins">${cells}</div></div>`}

/* ---------- map ---------- */
const G=GEO.trim().split('\n').map(l=>{const[k,ref,pts]=l.split('|');return{k,ref,pts:pts.split(' ').map(p=>p.split(',').map(Number))}});
const HOLES=[];G.filter(g=>g.k==='hole').forEach(g=>HOLES[+g.ref-1]=g.pts);
const CLUB=(()=>{const c=G.find(g=>g.k==='clubhouse').pts;return[c.reduce((s,p)=>s+p[0],0)/c.length,c.reduce((s,p)=>s+p[1],0)/c.length]})();
const pathD=(pts,close)=>'M'+pts.map(p=>p.join(' ')).join('L')+(close?'Z':'');
function along(pts,f){let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
  let x=f*L;for(let i=0;i<seg.length;i++){if(x<=seg[i]){const r=seg[i]?x/seg[i]:0;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*r,pts[i][1]+(pts[i+1][1]-pts[i][1])*r]}x-=seg[i]}return pts[pts.length-1]}
const VB={all:[225,60,830,1095],front:null,back:null};
['front','back'].forEach((n,k)=>{const ps=HOLES.slice(k*9,k*9+9).flat();const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);const pad=55;VB[n]=[Math.min(...xs)-pad,Math.min(...ys)-pad,Math.max(...xs)-Math.min(...xs)+pad*2,Math.max(...ys)-Math.min(...ys)+pad*2]});
const BASE=(()=>{const fill={course:'#2A6A43',water_hazard:'#3A7CA0',fairway:'#4E9B60',green:'#8FD3A0',bunker:'#E9DEBB',clubhouse:'#F4EFE0'};
  let s=`<rect x="-50" y="-50" width="1200" height="1300" fill="#1C4D33"/>`;
  ['course','water_hazard','fairway','green','bunker'].forEach(k=>G.filter(g=>g.k===k).forEach(g=>{s+=`<path d="${pathD(g.pts,true)}" fill="${fill[k]}"${k==='green'?' stroke="#BFE8C8" stroke-width="1.5"':''}/>`}));
  G.filter(g=>g.k==='cartpath').forEach(g=>s+=`<path d="${pathD(g.pts)}" fill="none" stroke="#D9CFB2" stroke-opacity=".35" stroke-width="3"/>`);
  G.filter(g=>g.k==='clubhouse').forEach(g=>s+=`<path d="${pathD(g.pts,true)}" fill="${fill.clubhouse}" stroke="#173A2A" stroke-width="2"/>`);
  HOLES.forEach((pts,h)=>{s+=`<path d="${pathD(pts)}" fill="none" stroke="#F4EFE0" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 7"/>`;
    const g=pts[pts.length-1];s+=`<line x1="${g[0]}" y1="${g[1]}" x2="${g[0]}" y2="${g[1]-24}" stroke="#F4EFE0" stroke-width="2.5"/><path d="M${g[0]} ${g[1]-24}l14 5l-14 5z" fill="#E2B53E"/>`;
    const t=pts[0];s+=`<g><circle cx="${t[0]}" cy="${t[1]}" r="15" fill="#0B2C1D" stroke="#F4EFE0" stroke-width="2"/><text x="${t[0]}" y="${t[1]+5.5}" text-anchor="middle" font-family="Oswald, Arial, sans-serif" font-size="16" font-weight="600" fill="#F4EFE0">${h+1}</text></g>`});
  s+=`<text x="${CLUB[0]-60}" y="${CLUB[1]+44}" font-family="Oswald, Arial, sans-serif" font-size="17" letter-spacing="2" fill="#F4EFE0">CLUBHOUSE</text>`;
  return s})();
function bubbleSpots(){const spots={},byHole={},wait=[],fin=[];
  TEAMS.forEach(T=>{const t=T.i,d=done(t);if(S.clock<T.tee&&d===0)wait.push(t);else if(d===18)fin.push(t);else(byHole[d]=byHole[d]||[]).push(t)});
  Object.entries(byHole).forEach(([h,ts])=>{ts.sort((a,b)=>a-b);ts.forEach((t,k)=>{spots[t]=along(HOLES[h],Math.min(.1+k*.22,.9))})});
  wait.forEach((t,k)=>spots[t]=[CLUB[0]+70+(k%4)*58,CLUB[1]+95+Math.floor(k/4)*58]);
  fin.forEach((t,k)=>spots[t]=[CLUB[0]-230+(k%4)*58,CLUB[1]-40+Math.floor(k/4)*58]);
  return spots}
function viewMap(){const v=viewer();const vb=VB[S.mapZoom];const spots=bubbleSpots();
  const bubs=TEAMS.map(T=>{const t=T.i,[x,y]=spots[t],me=v.kind==='cap'&&v.t===t,sel=S.sel===t;
    return`<g class="tb" data-team="${t}" style="transform:translate(${x}px,${y}px)" role="button" tabindex="0" aria-label="${esc(T.name)}"><circle r="${me?30:26}" fill="${me?'#E2B53E':'#F4EFE0'}" stroke="${sel?'#E2B53E':me?'#FBF8EE':'#0B2C1D'}" stroke-width="${sel?5:3}"/><text y="7" text-anchor="middle" font-family="Oswald, Arial, sans-serif" font-size="20" font-weight="600" fill="#0B2C1D">${T.ini}</text></g>`}).join('');
  let info='<div class="note dim">Tap a bubble to see that team.</div>';
  if(S.sel!=null){const t=S.sel,T=TEAMS[t],d=done(t),P=paceState(t),vis=canSee(v,t);
    info=`<div class="card info"><div class="lbl" style="color:var(--gold-ink)">${d===18?'Finished':d===0&&S.clock<T.tee?'Waiting to tee off':'On hole '+(d+1)}</div><h3>${esc(T.name)}</h3>
    <div class="tsub">${esc(T.roster.join(' · '))}</div><div class="num" style="font-size:15px">Thru ${d} · ${vis?(d?fp(toPar(t)):'–'):'score hidden'} · ${P.txt}</div></div>`}
  return`<div class="stack"><div class="map-ctl">${['all','front','back'].map(z=>`<button class="chip-btn" type="button" data-zoom="${z}" aria-pressed="${S.mapZoom===z}">${{all:'Whole course',front:'Front 9',back:'Back 9'}[z]}</button>`).join('')}</div>
  <div class="map-box"><svg id="mapsvg" viewBox="${vb.join(' ')}" role="img" aria-label="Acorns Golf Links from above with team positions" xmlns="http://www.w3.org/2000/svg">${BASE}${bubs}</svg></div>
  <div class="legend"><span><i style="background:var(--gold)"></i>${v.kind==='cap'?'Your team':'Team'}</span><span><i style="background:var(--cream)"></i>Other teams</span><span>Bubble sits on the tee of the next hole</span></div>
  ${info}</div>`}

/* ---------- rules ---------- */
const RULES=[
 ['Tee shot quota: one tee shot must be used per player per nine holes. Mark the drive on the scorecard.',1],
 ['Beer shotguns: every team member shotguns a beer (and sends the Snapchat video) before holes 6 and 12.',1],
 ['Closest to the pin on holes 9 and 15. You don’t have to play that ball if you need someone’s quota tee shot.',1],
 ['Make your tee time. We all know the Dillenberger Debacle of 2018. Be there 20 minutes early.',0],
 ['You can pull pins. If you don’t, the putt must drop and settle in the hole. Pull out of bunkers.',0],
 ['No wife beaters. Clothes must stay on.',0],
 ['Tie for 1st: a playoff hole chosen by the board, most likely 18. If that ties, a putt-off or another option decided by the board.',1],
 ['Tie for 2nd or 3rd: scorecard playoff starting with the hardest handicap hole (7), then the next hardest, and so on.',1],
 ['Putt out. No two-putt rule.',0],
 ['One club length, no closer to the hole, and you can’t improve the cut your ball was in.',0],
 ['We are not playing bunkers. Pull out, no closer to the hole, and no better angle to the hole.',0],
];
function viewRules(){return`<div class="card stack"><div class="sec-h"><h2>Gruesome house rules</h2><span class="lbl">Blue tees · white on 18</span></div>
 <div class="rules">${RULES.map(([r,tr],i)=>`<div class="rule"><div class="n num">${i+1}</div><div>${esc(r)}${tr?'<br><span class="tag">Tracked in the app</span>':''}</div></div>`).join('')}</div></div>`}

/* ---------- render & events ---------- */
function render(){renderWho();
  $('#clockLbl').textContent=fmt(S.clock);$('#clock').value=S.clock;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  const v={card:viewCard,board:viewBoard,map:viewMap,rules:viewRules}[S.tab]();
  if(S.tab==='map'&&$('#mapsvg')){updateMap();return}
  $('#view').innerHTML=v}
function updateMap(){// keep the svg so bubbles animate between spots
  const v=viewer(),spots=bubbleSpots();$('#mapsvg').setAttribute('viewBox',VB[S.mapZoom].join(' '));
  document.querySelectorAll('.tb').forEach(g=>{const t=+g.dataset.team,[x,y]=spots[t];g.style.transform=`translate(${x}px,${y}px)`;
    const me=v.kind==='cap'&&v.t===t,c=g.querySelector('circle');c.setAttribute('r',me?30:26);c.setAttribute('fill',me?'#E2B53E':'#F4EFE0');c.setAttribute('stroke',S.sel===t?'#E2B53E':me?'#FBF8EE':'#0B2C1D');c.setAttribute('stroke-width',S.sel===t?5:3)});
  const tmp=document.createElement('div');tmp.innerHTML=viewMap();
  const parts=$('#view').firstElementChild.children;const np=tmp.firstElementChild.children;
  parts[0].replaceWith(np[0]);parts[2].replaceWith(np[2]);parts[3].replaceWith(np[3]);
  // np shrinks as nodes move; re-query is enough
}
function fullRender(){S.tab==='map'&&$('#mapsvg')&&($('#view').innerHTML='');render()}

const sel=$('#viewAs');
sel.innerHTML=`<option value="pub">Public board (bettors, TV)</option><option value="op">Operator (sees everything)</option>`+TEAMS.map(t=>`<option value="c${t.i}">Captain · ${esc(t.name)} · ${fmt(t.tee)}</option>`).join('');
sel.value=S.view;
sel.onchange=()=>{S.view=sel.value;S.draft=null;S.edit=null;S.sel=null;fullRender()};
$('#clock').oninput=e=>{S.clock=+e.target.value;S.draft=S.edit!=null?S.draft:null;render()};
$('#play').onclick=()=>{if(S.playing){clearInterval(S.playing);S.playing=null;$('#play').textContent='Play';return}
  $('#play').textContent='Pause';S.playing=setInterval(()=>{S.clock=Math.min(975,S.clock+3);if(S.clock>=975){clearInterval(S.playing);S.playing=null;$('#play').textContent='Play'}if(S.edit==null)S.draft=null;render()},350)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;$('#view').innerHTML='';render();window.scrollTo(0,0)});
$('#view').addEventListener('click',e=>{const b=e.target.closest('button,[data-team]');if(!b)return;const v=viewer();
  if(b.id==='minus'&&S.draft.score>1){S.draft.score--;render()}
  else if(b.id==='plus'&&S.draft.score<10){S.draft.score++;render()}
  else if(b.dataset.drive!=null){S.draft.drive=+b.dataset.drive;render()}
  else if(b.id==='save'){const t=v.t,h=S.draft.h,E=S.entries[t];
    for(let k=0;k<h;k++){if(E.scores[k]==null){E.scores[k]=score(t,k);E.drives[k]=drive(t,k)}}
    E.scores[h]=S.draft.score;E.drives[h]=S.draft.drive;const wasEdit=S.edit!=null;S.edit=null;S.draft=null;
    toast(wasEdit?`Hole ${h+1} updated.`:h===17?'Hole 18 saved. Card complete.':`Hole ${h+1} saved. On to the ${h+2} tee.`);render()}
  else if(b.id==='cancelEdit'){S.edit=null;S.draft=null;render()}
  else if(b.dataset.hole!=null){S.edit=+b.dataset.hole;S.draft=null;render();window.scrollTo(0,0)}
  else if(b.id==='sign'){S.signed[v.t]=true;toast('Card signed and locked.');render()}
  else if(b.dataset.zoom){S.mapZoom=b.dataset.zoom;render()}
  else if(b.dataset.team!=null){S.sel=+b.dataset.team;render()}});
$('#view').addEventListener('keydown',e=>{const g=e.target.closest('[data-team]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.sel=+g.dataset.team;render()}});
$('#view').addEventListener('change',e=>{if(e.target.id==='sgBox'){const v=viewer(),h=S.draft.h;S.entries[v.t].sg[h===5?6:12]=e.target.checked;toast(e.target.checked?'Shotgun logged. Cheers.':'Shotgun unchecked.');render()}});
render();
</script>
